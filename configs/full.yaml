# Full pool configuration
# Purpose: Comprehensive 10-member ensemble study (5x ResEnc-M, 3x original, 2x ResEnc-L)
tier: FULL

paths:
  drive_root: /content/drive/MyDrive/KiTS23_Cert
  data_dir: /content/dataset
  dataset_zip: /content/dataset and kits23.zip
  work_dir: /content/work
  results_dir: /content/results
  outputs_dir: /content/drive/MyDrive/KiTS23_Cert/outputs
  logs_dir: /content/drive/MyDrive/KiTS23_Cert/logs
  nnunet_raw: /content/work/nnUNet_raw
  nnunet_preprocessed: /content/work/nnUNet_preprocessed
  nnunet_results: /content/drive/MyDrive/KiTS23_Cert/results/nnUNet_results

splits:
  train_ratio: 0.60
  cal_ratio: 0.20
  test_ratio: 0.20
  random_seed: 20261026
  max_cases: 200  # Exactly 200 cases in the study as requested

model_pool:
  dataset_name: Dataset501_KiTS23_Train
  dataset_id: 501
  configuration: 3d_fullres
  num_epochs: 100  # Exact user constraint: 100 epochs
  members:
    # 5x ResEnc-M
    - name: ResEnc_M_s1
      preset: ResEnc_M
      seed: 101
      trainer_name: nnUNetTrainer_KiTS23_100ep_s101
      fold: "all"
    - name: ResEnc_M_s2
      preset: ResEnc_M
      seed: 102
      trainer_name: nnUNetTrainer_KiTS23_100ep_s102
      fold: "all"
    - name: ResEnc_M_s3
      preset: ResEnc_M
      seed: 103
      trainer_name: nnUNetTrainer_KiTS23_100ep_s103
      fold: "all"
    - name: ResEnc_M_s4
      preset: ResEnc_M
      seed: 104
      trainer_name: nnUNetTrainer_KiTS23_100ep_s104
      fold: "all"
    - name: ResEnc_M_s5
      preset: ResEnc_M
      seed: 105
      trainer_name: nnUNetTrainer_KiTS23_100ep_s105
      fold: "all"
    # 3x original 3d_fullres
    - name: 3d_fullres_s1
      preset: original_3d_fullres
      seed: 201
      trainer_name: nnUNetTrainer_KiTS23_100ep_s201
      fold: "all"
    - name: 3d_fullres_s2
      preset: original_3d_fullres
      seed: 202
      trainer_name: nnUNetTrainer_KiTS23_100ep_s202
      fold: "all"
    - name: 3d_fullres_s3
      preset: original_3d_fullres
      seed: 203
      trainer_name: nnUNetTrainer_KiTS23_100ep_s203
      fold: "all"
    # 2x ResEnc-L
    - name: ResEnc_L_s1
      preset: ResEnc_L
      seed: 301
      trainer_name: nnUNetTrainer_KiTS23_100ep_s301
      fold: "all"
    - name: ResEnc_L_s2
      preset: ResEnc_L
      seed: 302
      trainer_name: nnUNetTrainer_KiTS23_100ep_s302
      fold: "all"

grid:
  num_lambda_points: 60
  min_threshold: 1.0e-6
  max_threshold: 0.5
  num_radius_points: 41
  tau_min: 0.35
  beta_f3: 1.0

cert:
  alpha_levels: [0.05, 0.10]
  gamma_primary: 0.50
  gamma_sensitivity: [0.10, 0.90]
  fp_budget: 2.0
  delta_ltt: 0.10
  num_resplits: 1000
  bootstrap_samples: 1000
